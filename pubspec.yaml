name: mody_alumni_connect
description: A mentorship platform connecting Mody University students with alumni.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.2
  firebase_analytics: ^12.0.2

  # State Management
  provider: ^6.1.1
  get: ^4.6.6

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  flutter_launcher_icons: ^0.14.4

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.2
  share_plus: ^12.0.0
  fluttertoast: ^9.0.0
  shimmer: ^3.0.0
  
  # Notification
  flutter_local_notifications: ^19.4.2

  # Chat
  timeago: ^3.6.0
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

